version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geospatial_measurement_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:///./data/geospatial.db
      - UPLOAD_DIR=./data/uploads
      - TEMP_DIR=./data/temp
      - MAX_UPLOAD_SIZE_MB=50
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
