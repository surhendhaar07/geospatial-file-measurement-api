[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-file-measurement-api"
version = "1.0.0"
description = "Production-grade Geospatial File Measurement REST API built with FastAPI, GeoPandas, and Shapely."
authors = [{ name = "Senior Backend & Geospatial Engineer" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "geopandas>=0.14.3",
    "shapely>=2.0.3",
    "pyproj>=3.6.1",
    "pyogrio>=0.7.2",
    "fastkml>=0.12",
    "lxml>=5.1.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "B008",      # FastAPI Depends in function defaults
    "BLE001",    # Catching general Exception for resilient API error envelopes
    "ASYNC230",  # Streaming file writes inside async endpoints
]
